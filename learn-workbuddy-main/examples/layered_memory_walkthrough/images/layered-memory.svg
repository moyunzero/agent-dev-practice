<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1100" height="790" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Layered Memory Walkthrough</text>
  <text x="550" y="66" text-anchor="middle" font-size="13" fill="#475569">持久证据各归其主 · 查询与 Prompt 只生成有界派生视图 · fresh process 从磁盘恢复</text>

  <text x="170" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Durable owners</text>
  <text x="535" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Policy / derived view</text>
  <text x="900" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Fresh process recovery</text>

  <!-- Durable owners -->
  <rect x="35" y="122" width="270" height="82" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="149" font-size="14" font-weight="700" fill="#1e40af">S09 Transcript</text>
  <text x="55" y="172" font-size="11" fill="#475569">append-only session events</text>
  <text x="55" y="190" font-size="11" fill="#475569">stable event_id · replay</text>

  <rect x="35" y="222" width="270" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="55" y="249" font-size="14" font-weight="700" fill="#166534">S10 Workspace Memory</text>
  <text x="55" y="272" font-size="11" fill="#475569">daily JSONL facts</text>
  <text x="55" y="290" font-size="11" fill="#475569">project scope · evidence IDs</text>

  <rect x="35" y="322" width="270" height="82" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="55" y="349" font-size="14" font-weight="700" fill="#7e22ce">S11 User Memory</text>
  <text x="55" y="372" font-size="11" fill="#475569">profile + keyed preferences</text>
  <text x="55" y="390" font-size="11" fill="#475569">user scope · explicit mutation</text>

  <rect x="35" y="422" width="270" height="82" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="55" y="449" font-size="14" font-weight="700" fill="#9a3412">S13 Artifact + lease journal</text>
  <text x="55" y="472" font-size="11" fill="#475569">immutable result + append-only leases</text>
  <text x="55" y="490" font-size="11" fill="#475569">path · SHA-256 · prepare/commit</text>

  <!-- Policies and derived views -->
  <line x1="305" y1="163" x2="390" y2="163" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="400" y="122" width="270" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="149" font-size="14" font-weight="700" fill="#1e40af">Explicit selection + S12 recall</text>
  <text x="420" y="172" font-size="11" fill="#475569">candidate → stored record → hit</text>
  <text x="420" y="190" font-size="11" fill="#475569">query · rank · score · provenance</text>

  <line x1="305" y1="263" x2="390" y2="263" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="400" y="222" width="270" height="82" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="249" font-size="14" font-weight="700" fill="#166534">Distill repeated evidence</text>
  <text x="420" y="272" font-size="11" fill="#475569">2 facts → 1 curated entry</text>
  <text x="420" y="290" font-size="11" fill="#475569">source log remains unchanged</text>

  <line x1="305" y1="363" x2="390" y2="363" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="400" y="322" width="270" height="82" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text x="420" y="349" font-size="14" font-weight="700" fill="#7e22ce">Keyed dedup + scope gate</text>
  <text x="420" y="372" font-size="11" fill="#475569">created → unchanged</text>
  <text x="420" y="390" font-size="11" fill="#475569">Alice preference ≠ Bob preference</text>

  <line x1="305" y1="463" x2="390" y2="463" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="400" y="422" width="270" height="82" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="420" y="449" font-size="14" font-weight="700" fill="#9a3412">Crash-safe reference publish</text>
  <text x="420" y="472" font-size="11" fill="#475569">prepare → Memory write → commit</text>
  <text x="420" y="490" font-size="11" fill="#475569">locked recovery protects pending lease</text>

  <!-- Restart boundary and recovery -->
  <line x1="710" y1="112" x2="710" y2="520" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="710" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">process restart</text>

  <line x1="670" y1="163" x2="755" y2="163" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="670" y1="263" x2="755" y2="263" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="670" y1="363" x2="755" y2="363" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="670" y1="463" x2="755" y2="463" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="765" y="122" width="300" height="382" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="915" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Re-open durable owners</text>
  <line x1="795" y1="170" x2="1035" y2="170" stroke="#bbf7d0" stroke-width="2"/>
  <text x="795" y="201" font-size="12" font-weight="700" fill="#166534">Transcript</text>
  <text x="900" y="201" font-size="11" fill="#475569">2 events replayed</text>
  <text x="795" y="247" font-size="12" font-weight="700" fill="#166534">Workspace</text>
  <text x="900" y="247" font-size="11" fill="#475569">1 curated / 2 evidence IDs</text>
  <text x="795" y="293" font-size="12" font-weight="700" fill="#166534">User</text>
  <text x="900" y="293" font-size="11" fill="#475569">1 Alice / 0 Bob preference</text>
  <text x="795" y="339" font-size="12" font-weight="700" fill="#166534">Recall</text>
  <text x="900" y="339" font-size="11" fill="#475569">source-bearing hit rebuilt</text>
  <text x="795" y="385" font-size="12" font-weight="700" fill="#166534">Artifact</text>
  <text x="900" y="385" font-size="11" fill="#475569">lease fold + digest + orphan GC</text>
  <line x1="795" y1="410" x2="1035" y2="410" stroke="#bbf7d0" stroke-width="2"/>
  <text x="915" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Reconstruct DurableContextState</text>
  <text x="915" y="465" text-anchor="middle" font-size="11" fill="#475569">confirmed fact + pending artifact review</text>
  <text x="915" y="484" text-anchor="middle" font-size="11" fill="#475569">source pointer + confirmed time</text>

  <!-- Compaction merge -->
  <rect x="65" y="590" width="350" height="88" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="619" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Disposable Messages</text>
  <text x="240" y="643" text-anchor="middle" font-size="11" fill="#475569">deep copy → truncate → prune → adversarial summary</text>
  <text x="240" y="662" text-anchor="middle" font-size="11" fill="#475569">允许有损，可从 Transcript 重新派生</text>

  <path d="M 915 504 L 915 548 L 825 548 L 825 590" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="685" y="590" width="350" height="88" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="860" y="619" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Lossless Durable State</text>
  <text x="860" y="643" text-anchor="middle" font-size="11" fill="#475569">事实与待办绕过全部 compaction layers</text>
  <text x="860" y="662" text-anchor="middle" font-size="11" fill="#475569">每轮由结构化记录重新渲染</text>

  <path d="M 240 678 L 240 730 L 455 730" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 860 678 L 860 730 L 645 730" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="465" y="698" width="170" height="65" rx="14" fill="#0f172a"/>
  <text x="550" y="726" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Next Prompt</text>
  <text x="550" y="748" text-anchor="middle" font-size="11" fill="#cbd5e1">compacted view + durable context</text>

  <text x="550" y="782" text-anchor="middle" font-size="11" fill="#64748b">Walkthrough 只编排现有 S09–S14；不新增第二套 Memory 真源</text>
</svg>
